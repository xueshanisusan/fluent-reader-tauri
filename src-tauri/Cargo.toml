[package]
name = "fluent-reader-tauri-spike"
version = "0.0.1"
description = "Tauri spike for fluent-reader migration"
edition = "2021"

[lib]
name = "fluent_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
