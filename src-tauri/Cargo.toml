[package]
name = "fluent-reader-tauri-spike"
version = "0.0.1"
description = "Tauri spike for fluent-reader migration"
edition = "2021"

[lib]
name = "fluent_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
thiserror = "1"
base64 = "0.22"
feed-rs = "2"
scraper = "0.20"
quick-xml = "0.37"
md-5 = "0.10"
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

[dev-dependencies]
tempfile = "3"
httpmock = "0.7"

[features]
custom-protocol = ["tauri/custom-protocol"]
